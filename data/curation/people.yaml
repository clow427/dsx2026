# Curated person directory (identity-resolution Req 1.2, 1.3, 2.1).
#
# Hand-curated, evidence-backed people. Each entry becomes a canonical person
# node (`person:canonical:<slug>`) in data/modules/people.json via
# pipelines/identity/directory.py (task 2).
#
# Data-integrity rules (.kiro/steering/data-integrity.md) that this file obeys:
#   - Never invent facts. Every degree, department, graduation year, or employer
#     below is stated by the public source in its `evidence` URL. If a source did
#     not state a field, the field is omitted rather than guessed.
#   - `status: verified_alumnus` is used ONLY where a public source explicitly
#     states a Boston University degree. Everyone else is
#     `bu_affiliated_researcher` (published/worked at BU, degree not confirmed).
#   - Every entry carries at least one evidence URL and
#     `submitted_by: manual_curation`.
#
# Candidates were surfaced from P1's data/modules/research.json via
# `python -m pipelines.identity.shortlist`, then each fact was verified against a
# public source: the person's ORCID record (https://orcid.org/<id>) and/or the
# Boston University academics faculty archive, which lists faculty degrees.
#
# Evidence source types map to the schema `source` enum:
#   institutional_bio  -> a bu.edu faculty/profile page
#   user_submitted     -> an ORCID record (public, self-asserted professional record)

# ---------------------------------------------------------------------------
# verified_alumnus: a public source explicitly states a Boston University degree
# ---------------------------------------------------------------------------

- slug: howard-cabral-biostatistics
  name: Howard Cabral
  orcid: 0000-0002-1185-8331
  # photo omitted: no openly licensed photo found (checked Wikidata P18 by ORCID,
  # Q34445925, 2026-10-24); ask the person for a user-submitted photo or BU for permission.
  bu:
    status: verified_alumnus
    degree: PhD
    department: Biostatistics
    graduation_year: 1998
    evidence:
      # ORCID education entry: Ph.D., Biostatistics, Boston University, 1998.
      - { source: user_submitted, url: "https://orcid.org/0000-0002-1185-8331" }
      # BU academics archive lists: "MPH, PhD, Boston University".
      - { source: institutional_bio, url: "https://www.bu.edu/academics/archive/2013-2014/grs/faculty/biostatistics/" }
  submitted_by: manual_curation

