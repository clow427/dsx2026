# Manual match review decisions (identity-resolution Req 3.4).
#
# A decision here OVERRIDES the automated match result produced by
# pipelines/identity/match.py (task 5). When match.py finds a decision whose
# canonical_id + member_ids match a pair it scored, it replaces the automated
# status/confidence with the one below and fills in the match's `reviewed` field
# with this entry's `by` and `at`.
#
# Shape of each decision:
#   canonical_id: person:canonical:<slug>   # must exist in people.json
#   member_ids:  [ person:<ns>:<id>, ... ]  # source-level records being judged
#   status:      merged | candidate | rejected
#   confidence:  high | medium | low        # a `merged` decision is never `low`
#   by:          reviewer name/handle
#   at:          YYYY-MM-DD                  # decision date
#   note:        free-text rationale (optional)
#
# This file is a seed fixture so the override logic (task 5) has something real
# to target. Decisions reference canonical people defined in people.yaml.

